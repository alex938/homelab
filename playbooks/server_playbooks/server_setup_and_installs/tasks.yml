---
- name: Maintenance and Health Checks
  hosts: homelab:k8s
  become: true
  vars_files:
    - vault2.yml

  tasks:
    # ---------------------------------------------------------
    # Docker Maintenance
    # ---------------------------------------------------------
    - name: Prune Docker system (containers, images, networks)
      ansible.builtin.command:
        cmd: "docker system prune -a -f --volumes"
      register: docker_prune_output
      changed_when: "'Total reclaimed space: 0B' not in docker_prune_output.stdout"

    # ---------------------------------------------------------
    # APT (Debian/Ubuntu) Maintenance
    # ---------------------------------------------------------
    - name: Fix broken apt sources
      ansible.builtin.command:
        cmd: "apt-get update --fix-missing"
      ignore_errors: yes
      when: ansible_os_family == "Debian"

    - name: Update packages (Debian/Ubuntu)
      apt:
        upgrade: yes
        update_cache: yes
        force_apt_get: yes
        autoclean: yes
        autoremove: yes
      when: ansible_os_family == "Debian"
      register: apt_result

    - name: Explicitly remove unused dependencies and old kernels (purge)
      command: apt-get -y autoremove --purge
      when: ansible_os_family == "Debian"
      register: apt_purge_result
      changed_when: "'0 upgraded, 0 newly installed, 0 to remove' not in apt_purge_result.stdout"

    - name: Check if reboot is required (Debian/Ubuntu)
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == "Debian"

    # ---------------------------------------------------------
    # YUM/DNF (CentOS/RedHat) Maintenance
    # ---------------------------------------------------------
    - name: Update and upgrade packages (CentOS)
      yum:
        name: "*"
        state: latest
        update_cache: yes
        autoremove: yes
      when: ansible_distribution == "CentOS"
      register: yum_result

    - name: Check if reboot is required (CentOS)
      command: needs-restarting -r
      register: centos_reboot_check
      failed_when: false
      changed_when: false
      when: ansible_distribution == "CentOS"

    # ---------------------------------------------------------
    # System Cleanup & Health
    # ---------------------------------------------------------
    - name: Clean up journal logs (keep 2 weeks)
      ansible.builtin.command: journalctl --vacuum-time=2weeks
      when: ansible_os_family in ["Debian", "RedHat"]
      changed_when: false

    - name: Clean old files from /tmp (older than 7 days)
      find:
        paths: /tmp
        age: 7d
        recurse: yes
      register: tmp_files_to_delete

    - name: Remove old files from /tmp
      file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ tmp_files_to_delete.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Check for failed systemd services
      command: systemctl list-units --state=failed --no-legend
      register: failed_services
      changed_when: false

    - name: Check NTP synchronization status
      command: timedatectl show --property=NTPSynchronized --value
      register: ntp_status
      changed_when: false
      ignore_errors: yes

    - name: Count zombie processes
      shell: ps axo stat | grep -c Z || true
      register: zombie_count
      changed_when: false

    - name: Check for recent OOM kills (dmesg)
      shell: dmesg | grep -i "out of memory" | tail -n 5 || true
      register: oom_events
      changed_when: false

    - name: Run remote cleanup script
      ansible.builtin.shell:
        cmd: >-
          curl -fsSL https://raw.githubusercontent.com/alex938/misc/main/cleanup.sh
          | sudo bash -s -- --docker-images-all --deep-caches
        executable: /bin/bash
      changed_when: true

    # ---------------------------------------------------------
    # Reporting
    # ---------------------------------------------------------
    - name: Gather all facts
      ansible.builtin.setup:

    - name: Final System Report
      debug:
        msg: |
          ============================
          System Health Report
          ============================
          Hostname: {{ ansible_hostname }}
          Distro:   {{ ansible_distribution }} {{ ansible_distribution_version }}
          Uptime:   {{ ansible_uptime_seconds | int // 3600 }} hours, {{ (ansible_uptime_seconds | int % 3600) // 60 }} minutes

          Updates:
          - APT/YUM Changed: {{ apt_result.changed | default(yum_result.changed | default(false)) }}

          Reboot Status:
          - Debian/Ubuntu: {{ reboot_required_file.stat.exists | default(false) }}
          - CentOS: {{ centos_reboot_check.rc | default(0) == 1 }}

          Health Checks:
          - NTP Synced: {{ ntp_status.stdout | default('Unknown') }}
          - Zombies: {{ zombie_count.stdout | default('0') }}
          - OOM Events: {{ oom_events.stdout_lines | default([]) | length }}

          Resources:
          - CPU Cores: {{ ansible_processor_vcpus }}
          - Memory: {{ ansible_memtotal_mb }} MB Total / {{ ansible_memfree_mb }} MB Free
          - Disk (/): {{ (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | default(0) // 1024**3) }} GB Free

          Issues Found:
          - Failed Services: {{ failed_services.stdout_lines | default('None') }}
          ============================
